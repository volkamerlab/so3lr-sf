name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  # Optimization environment variables
  PIP_CACHE_DIR: ~/.cache/pip
  POETRY_CACHE_DIR: ~/.cache/pypoetry
  JAX_ENABLE_X64: true
  JAX_PLATFORM_NAME: cpu
  TF_CPP_MIN_LOG_LEVEL: 2

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better coverage

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies and installations
        uses: actions/cache@v4
        id: cache-poetry
        with:
          path: |
            .venv
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.jax_cache
            ~/.tensorflow
            ~/.keras
            ~/.cache/git
            ~/.gitconfig
          key: poetry-full-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/poetry.lock') }}
          restore-keys: |
            poetry-full-${{ runner.os }}-${{ matrix.python-version }}-
            poetry-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          # Use --no-dev flag to skip development dependencies if they're not needed
          poetry install --with test --no-interaction --no-ansi

      - name: Cache SO3LR model files
        uses: actions/cache@v4
        id: cache-so3lr
        with:
          path: so3lr_models
          key: so3lr-models-v2-${{ runner.os }}
          restore-keys: |
            so3lr-models-v2-
            so3lr-models-

      - name: Download SO3LR model files
        if: steps.cache-so3lr.outputs.cache-hit != 'true'
        run: |
          mkdir -p so3lr_models
          cd so3lr_models
          git clone --depth 1 --filter=blob:none --sparse https://github.com/general-molecular-simulations/so3lr.git
          cd so3lr
          git sparse-checkout set so3lr/params
          echo "Downloaded SO3LR models to: $(pwd)/so3lr/params"
          ls -la so3lr/params

      - name: Verify SO3LR cache (if restored)
        if: steps.cache-so3lr.outputs.cache-hit == 'true'
        run: |
          echo "SO3LR models restored from cache"
          ls -la so3lr_models/so3lr/so3lr/params

      - name: Cache efficiency report
        run: |
          echo "## Cache Status Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Poetry Cache**: ${{ steps.cache-poetry.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SO3LR Models Cache**: ${{ steps.cache-so3lr.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Virtual Environment Size**: $(du -sh .venv 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **SO3LR Models Size**: $(du -sh so3lr_models 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY

      - name: Run tests with coverage
        env:
          SO3LR_MODEL_PATH: ${{ github.workspace }}/so3lr_models/so3lr/so3lr/params
        run: |
          poetry run pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --cov-report=json --cov-fail-under=90 -v

      - name: Check coverage threshold
        run: |
          echo "## Coverage Threshold Check" >> $GITHUB_STEP_SUMMARY
          COVERAGE=$(poetry run coverage report --format=total)
          echo "- **Current Coverage**: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Required Threshold**: 90%" >> $GITHUB_STEP_SUMMARY
          # Convert to integer for comparison (multiply by 100 to handle decimals)
          COVERAGE_INT=$(echo "$COVERAGE * 100" | python3 -c "import sys; print(int(float(sys.stdin.read().strip().split()[0])))")
          THRESHOLD_INT=9000  # 90.00%
          if [ "$COVERAGE_INT" -lt "$THRESHOLD_INT" ]; then
            echo "❌ **FAILURE**: Coverage ${COVERAGE}% is below the required 90% threshold!" >> $GITHUB_STEP_SUMMARY
            echo "ERROR: Code coverage ${COVERAGE}% is below the required 90% threshold!"
            exit 1
          else
            echo "✅ **SUCCESS**: Coverage ${COVERAGE}% meets the 90% threshold requirement!" >> $GITHUB_STEP_SUMMARY
            echo "SUCCESS: Code coverage ${COVERAGE}% meets the 90% threshold requirement!"
          fi

      - name: Generate coverage badge
        run: |
          poetry run coverage-badge -o coverage.svg -f

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            coverage.json
            coverage.svg
          retention-days: 30

  coverage-report:
    needs: test
    runs-on: ubuntu-latest
    if: success()  # Only run if test job succeeded

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ubuntu-latest-py3.12

      - name: Coverage comment (PR only)
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: coverage.xml

      - name: Coverage summary (Push)
        if: github.event_name == 'push'
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0)) * 100
          branch_rate = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'**Line Coverage:** {line_rate:.2f}%')
          print(f'**Branch Coverage:** {branch_rate:.2f}%')
          print(f'**Status:** {'✅ PASS' if line_rate >= 85 else '❌ FAIL (< 85%)'}')
          " >> $GITHUB_STEP_SUMMARY