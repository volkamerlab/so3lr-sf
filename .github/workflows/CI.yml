name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
      pull-requests: write
      contents: write

env:
  PYTHON_VERSION: '3.12'
  # Optimization environment variables
  JAX_ENABLE_X64: true
  JAX_PLATFORM_NAME: cpu
  TF_CPP_MIN_LOG_LEVEL: 2

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better coverage

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache extra model/framework caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.jax_cache
            ~/.tensorflow
            ~/.keras
          key: caches-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            caches-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv sync --group test --frozen

      - name: Cache SO3LR model files
        uses: actions/cache@v4
        id: cache-so3lr
        with:
          path: so3lr_models
          key: so3lr-models-v2-${{ runner.os }}
          restore-keys: |
            so3lr-models-v2-
            so3lr-models-

      - name: Download SO3LR model files
        if: steps.cache-so3lr.outputs.cache-hit != 'true'
        run: |
          mkdir -p so3lr_models
          cd so3lr_models
          git clone --depth 1 --filter=blob:none --sparse https://github.com/general-molecular-simulations/so3lr.git
          cd so3lr
          git sparse-checkout set so3lr/params
          echo "Downloaded SO3LR models to: $(pwd)/so3lr/params"
          ls -la so3lr/params

      - name: Run tests with coverage
        env:
          SO3LR_MODEL_PATH: ${{ github.workspace }}/so3lr_models/so3lr/so3lr/params
        run: |
          uv run pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --cov-report=json -v

      - name: Generate coverage badge
        run: |
          uv run coverage-badge -o coverage.svg -f

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-latest-py3.12
          fail_ci_if_error: true
          verbose: true
          override_branch: main
          override_commit: ${{ github.sha }}
          override_pr: ${{ github.event.number }}
          override_build: ${{ github.run_number }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .coverage
            htmlcov/
            coverage.xml
            coverage.json
            coverage.svg
          retention-days: 30

  coverage-report:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ubuntu-latest-py3.12


      - name: Coverage summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0)) * 100
          branch_rate = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'**Line Coverage:** {line_rate:.2f}%')
          print(f'**Branch Coverage:** {branch_rate:.2f}%')
          print(f'**Status:** {'✅ PASS' if line_rate >= 85 else '❌ FAIL (< 85%)'}')
          " >> $GITHUB_STEP_SUMMARY
