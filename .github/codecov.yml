codecov:
  require_ci_to_pass: yes
  notify:
    after_n_builds: 1
  max_report_age: off

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 85%
        threshold: 1%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: 85%
        threshold: 5%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - "tests/"
  - "docs/"
  - "**/__pycache__"
  - "*.pyc"

flags:
  unittests:
    paths:
      - src/
    carryforward: true