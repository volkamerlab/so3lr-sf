[project]
name = "so3lr-sf"
version = "2.0.0"
description = "SO3krates Universal Pairwise Force Field with Long Range Interactions (SO3LR) as a scoring function for binding affinity calculations"
authors = [{ name = "Hamza Ibrahim" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy",
    "ase",
    "h5py",
    "rdkit>=2025.3.6,<2026",
    "prolif>=2.0.0,<3",
    "tensorflow>=2.20.0,<3",
    "keras>=3.11.3,<4",
    "scipy>=1.16.2,<2",
    "pandas>=2.3.2,<3",
    "matplotlib>=3.10.6,<4",
    "protobuf>=6.32.1,<7",
    "typing-extensions>=4.15.0,<5",
    "jax==0.10.2",
    "jaxlib==0.10.2",
    "jaxtyping>=0.3.2,<0.4",
    "orbax-checkpoint==0.12.4",
    "flax==0.12.8",
    "optax==0.2.8",
    # Git-sourced packages; URLs resolved in [tool.uv.sources] below.
    "so3lr",
    "mlff"
]

[project.scripts]
so3lrsf = "so3lr_sf:main"

[tool.uv]

default-groups = ["test"]

# Every git dependency is pinned to an exact commit. The mlff fork asks for branches
# of glp / jax-md / jraph / jax-pme / comms; these overrides use the commits so3lr
# v0.2.0 locks, so both resolve to one set.
override-dependencies = [
    "mlff @ git+https://github.com/hamzaibrahim21/mlff.git@9d56dbb17d05fb7944d7f18a1bebb71aaa335ae3",
    "glp @ git+https://github.com/fbruenig/glp.git@2294f4f59e940be64c45bf5e4d1bea5cb90809f8",
    "jax-md @ git+https://github.com/kabylda/jax-md.git@a1618449f7f00df5aa3b1e50105dacb5193b2cda",
    "jraph @ git+https://github.com/google-deepmind/jraph.git@51f5990104f7374492f8f3ea1cbc47feb411c69c",
    "jax-pme @ git+https://github.com/fbruenig/jax-pme.git@de9a3a9dfeb1f5b635a54a8f277c1ec3ecd2bf6d",
    "comms @ git+https://github.com/sirmarcel/comms.git@496034fd9bbb58d3b82dbe1affd11b33a7537c42",
]
[tool.uv.sources]
so3lr = { git = "https://github.com/general-molecular-simulations/so3lr.git", rev = "2a7480cb38cb0c75bc89784f32f8e253c1a70153" }
mlff = { git = "https://github.com/hamzaibrahim21/mlff.git", rev = "9d56dbb17d05fb7944d7f18a1bebb71aaa335ae3" }  # branch v2.0-jax0.10

[dependency-groups]
test = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=6.0.0,<7",
    "coverage>=7.6.0,<8",
    "coverage-badge>=1.1.0,<2",
    "pytest-xdist>=3.6.0,<4",
    "pytest-mock>=3.14.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["so3lr_sf.py", "src"]

# ---------------------------------------------------------------------------
# Coverage configuration (all outputs centralized under coverage/)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
data_file = "coverage/.coverage"
omit = [
    "src/__pycache__/*",
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage/htmlcov"
title = "SO3LR-SF Test Coverage Report"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.json]
output = "coverage/coverage.json"
