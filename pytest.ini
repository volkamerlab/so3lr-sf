[pytest]
# Pytest configuration
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test discovery and execution
#
# NOTE: coverage (--cov*) and --verbose are intentionally NOT in the default
# addopts. They pollute `--collect-only` output (coverage table + verbose tree
# format), which breaks IDE test-discovery adapters, and the coverage gate
# (fail_under=40 in .coveragerc) would fail otherwise-passing runs. Run coverage
# explicitly when you want it, e.g.:
#   pytest --cov=src --cov-report=term-missing --cov-report=html:coverage/htmlcov
addopts =
    --tb=short
    --strict-markers
    --disable-warnings

# Test markers
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for full workflows
    slow: Tests that take more than 1 second
    requires_model: Tests that require SO3LR model files
    requires_rdkit: Tests that require RDKit for visualization